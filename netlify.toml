# Sitio estático de Astro: Netlify solo compila y publica dist/.
# No hace falta adaptador ni funciones.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# El home en inglés ya no tiene ruta propia: el home cambia de idioma en el
# navegador y ?lang=en lo abre en inglés. /ojos fue la URL de prueba del home.
# El blog en inglés (/en/blog/) sí existe: Netlify sirve primero los archivos
# que existen, así que esta regla no lo toca. No ponerle force = true.
[[redirects]]
  from = "/en/*"
  to = "/?lang=en"
  status = 301

[[redirects]]
  from = "/ojos/proyectos/:slug"
  to = "/proyectos/:slug/"
  status = 301

[[redirects]]
  from = "/ojos/*"
  to = "/"
  status = 301

# Astro versiona por contenido todo lo que emite en /_astro (CSS, JS, fuentes,
# imágenes): el mismo nombre siempre es el mismo archivo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes de public/: no llevan hash, así que una caché corta.
# Cada deploy invalida igualmente la CDN de Netlify.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Videos de los servicios: pesan, así que se guardan una semana.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
